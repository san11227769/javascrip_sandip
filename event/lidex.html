<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling</title>
    <style>
        #event-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        img {
            height: 200px;
            width: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #event-image:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="event-container">
        <img id="item1" src="image/mig1.jpg" alt="Event Image" id="event-image">
        <img id="item2" src="image/img2.jpg" alt="Event Image" id="event-image">
        <img id="item3" src="image/img3.jpg" alt="Event Image" id="event-image">
        <img id="item4" src="image/img4.jpg" alt="Event Image" id="event-image">
        <a href="http://google.com" target="_blank" id="g-click" rel="noopener noreferrer">aaaaa</a>
    </div>
</body>
<script>

    //Event 
    // type of event: click, mouseover, mouseout, mouseenter, mouseleave, mousedown, mouseup, keydown, keyup, keypress, focus, blur, change, input, submit, load, unload, resize, scroll
    //time of event: capturing, bubbling
    //prevent default behavior: e.preventDefault()
    //stop propagation: e.stopPropagation() // default behavior of event is to bubble up to the parent element, but we can stop it from bubbling up by using this method
    //toElement: e.target
    //curentTarget: e.currentTarget
    //altKey: e.altKey, ShiftKey: e.shiftKey, CtrlKey: e.ctrlKey, MetaKey: e.metaKey

   document.querySelector('#event-container').addEventListener('click', function(e) {
        console.log(e.target.parentNode);
        if(e.target.tagName === 'IMG') {
                console.log('this is image');
               let removeIt = e.target.parentNode.children[0];
                removeIt.remove()
        }
     
        console.log('this is link');
    }, false);
    document.querySelector('#item1').addEventListener('click', function(e) {
        console.log('this is item1');
        
       
    }, false);

    document.querySelector('#item2').addEventListener('click', function(e) {
    console.log('this is item2');
         e.stopPropagation();
         
    }, false);

    document.querySelector('#g-click').addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        
    }, false);
   
    </script>
</html>
